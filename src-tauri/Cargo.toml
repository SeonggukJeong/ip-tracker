[package]
name = "ip-tracker"
version = "0.1.0"
edition = "2021"

[lib]
name = "ip_tracker_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
iptracker-core = { path = "../crates/core" }
regex = "1"
rusqlite = "0.43.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[dev-dependencies]
tempfile = "3.27.0"
