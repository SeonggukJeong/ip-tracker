[package]
name = "iptracker-core"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = "0.4"
flate2 = "1.1"
maxminddb = "0.33.0"
regex = "1"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
thiserror = "2"
walkdir = "2.5"

[dev-dependencies]
serde_json = "1"
tempfile = "3.27.0"
